<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar ayuda | Desgracias.es</title>
  <meta name="description" content="Describe con tus palabras lo que te está pasando y encuentra una ruta de ayuda dentro de Desgracias.es.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://desgracias.es/buscar/">
  <link rel="stylesheet" href="v9-search.css">
</head>
<body>
  <main>
    <p><a href="/">← Inicio</a></p>
    <h1>¿Qué te está pasando?</h1>
    <p>Escríbelo con tus propias palabras. Esta página procesa la búsqueda en tu navegador; Desgracias.es no envía ni almacena el texto que escribas.</p>

    <noscript>
      <style>#search-form{display:none}</style>
      <section class="result urgent" aria-labelledby="nojs-title">
        <h2 id="nojs-title">La búsqueda necesita JavaScript</h2>
        <p>No hace falta que escribas aquí para encontrar ayuda. Si existe peligro inmediato, llama al 112. Si estás pensando en suicidarte en España o te preocupa que alguien pueda hacerlo, también está disponible el 024. El 016 ofrece información, asesoramiento jurídico y atención psicosocial inmediata frente a todas las formas de violencia contra las mujeres.</p>
        <ul>
          <li><a href="tel:112">Llamar al 112</a></li>
          <li><a href="tel:024">Llamar al 024</a></li>
          <li><a href="tel:016">Llamar al 016</a></li>
        </ul>
        <p><a href="/ayuda-urgente.html">Ver ayuda urgente</a></p>
        <ul>
          <li><a href="/me-preocupa-que-alguien-pueda-suicidarse/">Me preocupa que alguien pueda suicidarse</a></li>
          <li><a href="/alguien-cercano-ha-intentado-suicidarse/">Alguien cercano ha intentado suicidarse</a></li>
          <li><a href="/duelo/ha-muerto-por-suicidio-alguien-que-quiero/">Ha muerto por suicidio alguien que quiero</a></li>
        </ul>
        <p><a href="/">Ver las categorías de Desgracias.es</a></p>
      </section>
    </noscript>

    <form id="search-form" autocomplete="off" novalidate>
      <label for="search-query">Describe tu situación</label>
      <textarea id="search-query" maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" aria-describedby="privacy-note"></textarea>
      <p id="privacy-note" class="muted">No incluyas nombres, direcciones, teléfonos ni otros datos personales.</p>
      <button type="submit">Encontrar por dónde empezar</button>
    </form>

    <p class="muted privacy-links"><a href="/privacidad.html">Privacidad</a> · <a href="mailto:info@desgracias.es">Contacto</a></p>

    <section id="result" class="result" aria-live="polite" tabindex="-1" hidden></section>
  </main>

  <script type="module">
    import { routeSearchQuery } from '../src/search-crisis-router.js';
    import { routeKnownContentQuery } from '../src/search-content-catalog.js';
    import { buildSearchClarification } from '../src/search-clarification.js';

    const form = document.querySelector('#search-form');
    const query = document.querySelector('#search-query');
    const result = document.querySelector('#result');

    function element(tag, text, attributes = {}) {
      const node = document.createElement(tag);
      node.textContent = text;
      for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
      return node;
    }

    function paragraphWithLink(label, href) {
      const paragraph = document.createElement('p');
      paragraph.append(element('a', label, { href }));
      return paragraph;
    }

    const OFFICIAL_RESOURCES = Object.freeze({
      '112': Object.freeze({ label: 'Llamar al 112', href: 'tel:112' }),
      '024': Object.freeze({ label: 'Llamar al 024', href: 'tel:024' }),
      '016': Object.freeze({ label: 'Llamar al 016', href: 'tel:016' })
    });

    function officialResources(resources = []) {
      const available = resources.map((code) => OFFICIAL_RESOURCES[code]).filter(Boolean);
      if (!available.length) return null;
      const block = document.createElement('div');
      block.append(element('p', 'Recursos oficiales en España:'));
      const list = document.createElement('ul');
      for (const resource of available) {
        const item = document.createElement('li');
        item.append(element('a', resource.label, { href: resource.href }));
        list.append(item);
      }
      block.append(list);
      return block;
    }

    function showClarificationFollowUp(option) {
      result.className = option.safety_level === 'P0' ? 'result urgent' : 'result';
      result.replaceChildren();

      if (option.id === 'safety_self') {
        result.append(
          element('h2', 'Lo primero es tu seguridad'),
          element('p', 'Si existe peligro inmediato, contacta con el 112. Si estás pensando en suicidarte en España, también está disponible el 024.'),
          officialResources(['112', '024']),
          paragraphWithLink('Ver ayuda urgente', '/ayuda-urgente.html')
        );
        result.focus();
        return;
      }

      if (option.id === 'safety_other') {
        result.append(
          element('h2', 'Lo primero es la seguridad de esa persona'),
          element('p', 'Si existe peligro inmediato para esa persona, contacta con el 112. Si te preocupa un posible riesgo suicida en España, también está disponible el 024.'),
          officialResources(['112', '024']),
          element('p', 'Si puedes, describe un poco más qué está ocurriendo para orientarte sin adivinar.')
        );
        query.focus();
        return;
      }

      result.append(
        element('h2', 'Cuéntame un poco más'),
        element('p', `Has indicado: ${option.label}. Añade solo el detalle necesario para distinguir el siguiente paso, sin nombres ni otros datos personales.`)
      );
      query.focus();
    }

    function renderClarification(routed) {
      const clarification = buildSearchClarification(routed);
      if (!clarification.needed) return false;

      result.className = routed.urgent_support?.available ? 'result urgent' : 'result';
      result.replaceChildren();

      if (routed.urgent_support?.available) {
        result.append(
          element('h2', 'Si existe riesgo ahora'),
          element('p', 'No asumimos que estés en una crisis. Si hay peligro inmediato, contacta con el 112; ante una posible crisis suicida en España, también está disponible el 024.'),
          officialResources(routed.urgent_support.official_resources_spain),
          paragraphWithLink(routed.urgent_support.label, routed.urgent_support.url)
        );
      }

      result.append(
        element('h2', clarification.title),
        element('p', clarification.guidance)
      );

      const choices = element('div', '', { class: 'choices', role: 'group', 'aria-label': 'Opciones para aclarar la situación' });
      for (const option of clarification.options) {
        const button = element('button', option.label, {
          type: 'button',
          class: 'choice',
          'data-safety': option.safety_level
        });
        button.addEventListener('click', () => showClarificationFollowUp(option));
        choices.append(button);
      }
      result.append(choices);
      return true;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const submittedQuery = query.value.trim();
      query.value = '';
      if (!submittedQuery) {
        result.hidden = false;
        result.className = 'result';
        result.replaceChildren(
          element('h2', 'Escribe qué te está pasando'),
          element('p', 'Añade solo el detalle necesario para orientarte, sin nombres ni otros datos personales.')
        );
        query.focus();
        return;
      }

      let routed = routeSearchQuery(submittedQuery);
      if (!routed.matched && !routed.urgent_support?.available) {
        const contentRouted = routeKnownContentQuery(submittedQuery);
        if (contentRouted.matched) routed = contentRouted;
      }

      result.hidden = false;
      result.className = routed.safety_level === 'P0' ? 'result urgent' : 'result';
      result.replaceChildren();

      if (!routed.matched) {
        if (renderClarification(routed)) return;
        result.append(
          element('h2', 'No quiero adivinar'),
          element('p', 'No he podido identificar con suficiente seguridad lo que necesitas. Prueba a describir la situación de otra forma o vuelve a las categorías de la web.'),
          paragraphWithLink('Ver opciones de ayuda', '/')
        );
        return;
      }

      result.append(element('h2', 'Empieza aquí'));
      if (routed.urgent) {
        const urgent = element('strong', 'Si existe peligro inmediato, utiliza el recurso oficial adecuado ahora.');
        const paragraph = document.createElement('p');
        paragraph.append(urgent);
        result.append(paragraph);
      }
      const resources = officialResources(routed.official_resources_spain);
      if (resources) result.append(resources);
      result.append(paragraphWithLink(routed.route.label, routed.route.url));
    });

    function clearSensitiveState() {
      query.value = '';
      result.replaceChildren();
      result.hidden = true;
      result.className = 'result';
    }

    window.addEventListener('pagehide', clearSensitiveState);
    window.addEventListener('pageshow', clearSensitiveState);
  </script>
</body>
</html>
