services:
  - type: web
    name: desgracias-api-staging
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: STORY_AUTHOR_UPDATE_PEPPER
        sync: false

  - type: web
    name: desgracias-ops-staging
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start:ops
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: STAGING_OPS_TOKEN
        sync: false

  - type: worker
    name: desgracias-worker-staging
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: staging
      - key: WORKER_POLL_MS
        value: "15000"
      - key: DATABASE_URL
        sync: false
