name: Apply Next Step Guidance

on:
  push:
    branches:
      - feature/next-step-guidance
    paths:
      - .github/workflows/apply-next-step-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/next-step-guidance
          fetch-depth: 0
      - name: Verify pristine application before patch
        run: |
          test -f app.js
          test -f next-step-guidance.js
          grep -q "const storyForm = document.getElementById('story-form');" app.js
          grep -q "showSubmissionReceipt(status, receiptMessage, String(data.withdrawalCode));" app.js
          if grep -q "NEXT_STEP_GUIDANCE_ADAPTER_V1" app.js; then
            echo "Adapter already applied"
            exit 0
          fi
      - name: Append isolated adapter
        run: |
          cat >> app.js <<'EOF'

/* NEXT_STEP_GUIDANCE_ADAPTER_V1
   Additive adapter only. Keeps the V9 layout untouched and renders guidance
   inside the existing submission receipt after a successful story submission. */
(() => {
  let lastGuidance = null;
  const originalGetSupabaseClient = getSupabaseClient;
  getSupabaseClient = async function patchedGetSupabaseClient() {
    const client = await originalGetSupabaseClient();
    if (!client.__desgraciasGuidanceWrapped) {
      const originalInvoke = client.functions.invoke.bind(client.functions);
      client.functions.invoke = async function patchedInvoke(functionName, options) {
        const response = await originalInvoke(functionName, options);
        if (functionName === 'submit-story' && response?.data?.guidance) {
          lastGuidance = response.data.guidance;
        }
        return response;
      };
      Object.defineProperty(client, '__desgraciasGuidanceWrapped', { value: true });
    }
    return client;
  };

  const originalShowSubmissionReceipt = showSubmissionReceipt;
  showSubmissionReceipt = function patchedShowSubmissionReceipt(status, message, withdrawalCode) {
    originalShowSubmissionReceipt(status, message, withdrawalCode);
    if (!lastGuidance || !status) return;
    const guidance = lastGuidance;
    lastGuidance = null;
    const render = () => window.DesgraciasNextStep?.render?.(guidance, status);
    if (window.DesgraciasNextStep) {
      render();
      return;
    }
    const script = document.createElement('script');
    script.src = '/next-step-guidance.js';
    script.defer = true;
    script.onload = render;
    script.onerror = () => console.warn('Next-step guidance UI could not be loaded.');
    document.head.append(script);
  };
})();
EOF
      - name: Syntax and integrity checks
        run: |
          node --check app.js
          node --check next-step-guidance.js
          test "$(grep -c 'NEXT_STEP_GUIDANCE_ADAPTER_V1' app.js)" -eq 1
          grep -q "storyForm?.addEventListener('submit'" app.js
          grep -q "loadPublicStories();" app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect next-step guidance UI safely"
          git push origin HEAD:feature/next-step-guidance
