name: Production Scheduled Monitors

on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-origin:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
    uses: andresvalledelacruz/Andelacruz/.github/workflows/production-origin-integrity.yml@production-v9

  p0-p1-resource-liveness:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 */6 * * *'
    uses: andresvalledelacruz/Andelacruz/.github/workflows/p0-p1-resource-liveness.yml@production-v9
