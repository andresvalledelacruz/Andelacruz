name: One-off Postvention Source Normalize

on:
  push:
    branches: [safety/repair-postvention-live-resources]
    paths:
      - 'scripts/one-off-normalize-postvention-source-sections.mjs'
      - '.github/workflows/one-off-postvention-source-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: safety/repair-postvention-live-resources

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Normalize source sections
        run: node scripts/one-off-normalize-postvention-source-sections.mjs

      - name: Verify focused regression test
        run: node --test tests/suicide-bereavement-live-resources.test.mjs

      - name: Commit generated normalization
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duelo/ha-muerto-por-suicidio-alguien-que-quiero/index.html
          git diff --cached --exit-code && { echo 'Expected generated normalization diff is empty'; exit 1; } || true
          git commit -m 'editorial: keep international sources outside Spanish nucleus'
          git push origin HEAD:safety/repair-postvention-live-resources
