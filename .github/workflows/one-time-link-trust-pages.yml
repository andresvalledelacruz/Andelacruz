name: One-time link trust pages

on:
  push:
    branches: [production-v9]
    paths:
      - '.github/workflows/one-time-link-trust-pages.yml'

permissions:
  contents: write

jobs:
  link-trust-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Add trust links to transparency footer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          needle = '''    if (!transparency.querySelector('a[href="privacidad.html"]')) {
      const privacyLink = document.createElement('a');'''
          if needle not in text:
              raise SystemExit('Expected transparency block not found; refusing blind edit')
          marker = '''    if (!transparency.querySelector('a[href="privacidad.html"]')) {'''
          insertion = '''    if (!transparency.querySelector('a[href="sobre.html"]')) {
      const aboutLink = document.createElement('a');
      aboutLink.href = 'sobre.html';
      aboutLink.textContent = 'Sobre Desgracias.es';
      transparency.insertBefore(aboutLink, transparency.querySelector('a[href="mailto:info@desgracias.es"]'));
    }
    if (!transparency.querySelector('a[href="como-revisamos.html"]')) {
      const methodLink = document.createElement('a');
      methodLink.href = 'como-revisamos.html';
      methodLink.textContent = 'Cómo revisamos';
      transparency.insertBefore(methodLink, transparency.querySelector('a[href="mailto:info@desgracias.es"]'));
    }
'''
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify links
        run: |
          grep -q "aboutLink.href = 'sobre.html'" app.js
          grep -q "methodLink.href = 'como-revisamos.html'" app.js

      - name: Commit internal links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "seo: link trust pages from transparency footer" || exit 0
          git push origin HEAD:production-v9
