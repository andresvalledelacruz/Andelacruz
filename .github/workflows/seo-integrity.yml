name: Production SEO Integrity

on:
  push:
    branches: [production-v9]
  pull_request:
    branches: [production-v9]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seo-integrity:
    name: SEO invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout production
        uses: actions/checkout@v7

      - name: Validate SEO invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from datetime import date
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.in_title = False
                  self.title_parts = []
                  self.metas = []
                  self.canonicals = []
                  self.h1_count = 0
                  self.hrefs = []
                  self.jsonld_count = 0
                  self.og_site_name = False
                  self.twitter_card = False
                  self.hero_preloads = []
                  self.hero_sources = []

              def handle_starttag(self, tag, attrs):
                  attrs = {k.lower(): (v or '') for k, v in attrs}
                  tag = tag.lower()
                  if tag == 'link' and attrs.get('as') == 'image' and attrs.get('href') == '/assets/manos-apoyo.webp': self.hero_preloads.append(attrs)
                  if tag == 'source' and attrs.get('type') == 'image/webp': self.hero_sources.append(attrs)
                  if tag == 'html': self.lang = attrs.get('lang')
                  elif tag == 'title': self.in_title = True
                  elif tag == 'meta':
                      self.metas.append(attrs)
                      if attrs.get('property', '').lower() == 'og:site_name': self.og_site_name = True
                      if attrs.get('name', '').lower() == 'twitter:card': self.twitter_card = True
                  elif tag == 'link' and 'canonical' in attrs.get('rel', '').lower().split(): self.canonicals.append(attrs.get('href', '').strip())
                  elif tag == 'h1': self.h1_count += 1
                  elif tag == 'a' and attrs.get('href'): self.hrefs.append(attrs['href'].strip())
                  elif tag == 'script' and attrs.get('type', '').lower() == 'application/ld+json': self.jsonld_count += 1
              def handle_endtag(self, tag):
                  if tag.lower() == 'title': self.in_title = False
              def handle_data(self, data):
                  if self.in_title: self.title_parts.append(data)
              @property
              def title(self): return re.sub(r'\s+', ' ', ''.join(self.title_parts)).strip()
              def meta_content(self, name): return [m.get('content', '').strip() for m in self.metas if m.get('name', '').lower() == name.lower()]

          def route_to_file(url):
              parsed=urlparse(url); assert parsed.scheme=='https' and parsed.netloc=='desgracias.es', f'Non-canonical sitemap origin: {url}'; assert not parsed.query and not parsed.fragment
              path=parsed.path
              if path=='/': return Path('index.html')
              if path.endswith('/'): return Path(path.lstrip('/'))/'index.html'
              return Path(path.lstrip('/'))
          def local_href_to_file(href):
              if not href.startswith('/') or href.startswith('//'): return None
              path=urlparse(href).path
              if path=='/': return Path('index.html')
              if not path: return None
              candidate=Path(path.lstrip('/'))
              if path.endswith('/'): return candidate/'index.html'
              if candidate.suffix in {'.html',''}: return candidate if candidate.suffix else candidate/'index.html'
              return None

          index=Path('index.html').read_text(encoding='utf-8'); sitemap_text=Path('sitemap.xml').read_text(encoding='utf-8'); robots=Path('robots.txt').read_text(encoding='utf-8'); withdrawal=Path('retirar.html').read_text(encoding='utf-8'); friends=Path('webs-amigas.html').read_text(encoding='utf-8')
          country_options_path=Path('country-options.js'); directory_path=Path('data/help-directory.json'); hero_webp=Path('assets/manos-apoyo.webp')
          required_home=['<html lang="es">','<link rel="canonical" href="https://desgracias.es/"','name="robots" content="index,follow,max-image-preview:large','property="og:site_name" content="Desgracias.es"','property="og:image" content="https://desgracias.es/assets/manos-apoyo.png"','name="twitter:card" content="summary_large_image"','type="application/ld+json"','width="1342" height="1172" fetchpriority="high"']
          missing_home=[item for item in required_home if item not in index]; assert not missing_home, f'Missing homepage SEO/performance signals: {missing_home}'
          hero_parser=PageParser(); hero_parser.feed(index)
          assert len(hero_parser.hero_preloads)==1 and len(hero_parser.hero_sources)==1
          preload=hero_parser.hero_preloads[0]; source=hero_parser.hero_sources[0]
          assert preload.get('fetchpriority')=='high' and preload.get('type')=='image/webp'
          assert preload.get('imagesrcset')==source.get('srcset') and preload.get('imagesizes')==source.get('sizes') and source.get('sizes')
          expected_hero=['/assets/manos-apoyo-480.webp 480w','/assets/manos-apoyo-768.webp 768w','/assets/manos-apoyo.webp 1000w']
          assert [item.strip() for item in source['srcset'].split(',')]==expected_hero
          for candidate in expected_hero:
              asset=Path(candidate.split()[0].lstrip('/')); data=asset.read_bytes(); assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert Path('assets/manos-apoyo-480.webp').stat().st_size<40000 and Path('assets/manos-apoyo-768.webp').stat().st_size<70000
          assert hero_webp.exists(); hero_bytes=hero_webp.stat().st_size; assert 10_000 <= hero_bytes <= 100_000
          root=ET.fromstring(sitemap_text); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}; entries=[]
          for node in root.findall('s:url',ns):
              loc=node.find('s:loc',ns); lastmod=node.find('s:lastmod',ns); assert loc is not None and loc.text; entries.append((loc.text.strip(),lastmod.text.strip() if lastmod is not None and lastmod.text else None))
          urls=[u for u,_ in entries]; assert urls and 'https://desgracias.es/' in urls and 'https://desgracias.es/retirar.html' not in urls and 'https://desgracias.es/webs-amigas.html' in urls and len(urls)==len(set(urls))
          today=date.today(); seen_titles={}; checked_internal_links=0
          for url,lastmod in entries:
              file_path=route_to_file(url); assert file_path.exists() and file_path.is_file(); assert lastmod; lm_date=date.fromisoformat(lastmod); assert lm_date<=today
              html=file_path.read_text(encoding='utf-8'); parser=PageParser(); parser.feed(html)
              expected_lang={'/ayuda/en/':'en','/ayuda/fr/':'fr','/ayuda/pt/':'pt','/ayuda/de/':'de','/ayuda/ar/':'ar'}.get(urlparse(url).path,'es'); assert parser.lang==expected_lang
              assert parser.title and 15<=len(parser.title)<=90; assert parser.title not in seen_titles; seen_titles[parser.title]=url
              descriptions=parser.meta_content('description'); assert len(descriptions)==1 and descriptions[0] and 40<=len(descriptions[0])<=220
              robots_meta=parser.meta_content('robots'); assert len(robots_meta)==1; robot_tokens={x.strip().lower() for x in robots_meta[0].split(',')}; assert 'index' in robot_tokens and 'noindex' not in robot_tokens
              assert len(parser.canonicals)==1 and parser.canonicals[0]==url; assert parser.h1_count==1; assert parser.jsonld_count>0 and parser.og_site_name and parser.twitter_card
              for href in parser.hrefs:
                  linked_file=local_href_to_file(href)
                  if linked_file is None: continue
                  checked_internal_links+=1; assert linked_file.exists(), f'Broken root-relative internal link on {url}: {href} -> {linked_file}'
          assert 'name="robots" content="noindex,follow"' in withdrawal
          assert 'name="robots" content="index,follow' in friends
          assert 'no implica colaboración, patrocinio ni acuerdo' in friends
          # Webs Amigas is intentionally Spain-only. International country selection belongs in Recursos/Buscar Ayuda.
          assert 'id="country-buttons"' not in friends, 'Webs Amigas must not contain the international country selector'
          assert 'webs-amigas-country-filter.js' not in friends, 'Webs Amigas must not load international country filtering'
          assert friends.count('data-organization=')==50, 'Spanish organizations must be available as 50 static cards'
          assert 'href="/recursos/"' in friends, 'International/country help must remain discoverable in Recursos'
          assert country_options_path.exists() and directory_path.exists()
          country_options=re.findall(r"\['[A-Z]{2}','[^']+','[^']+'\]",country_options_path.read_text(encoding='utf-8')); assert len(country_options)>=50
          directory=json.loads(directory_path.read_text(encoding='utf-8')); assert isinstance(directory.get('records'),list) and isinstance(directory.get('countries'),dict) and isinstance(directory.get('categories'),dict)
          records=directory['records']; assert len(records)>=204; assert sum(r.get('kind')=='organization' for r in records)==50; assert sum(r.get('kind')=='resource' for r in records)>=154
          for record in records:
              if record.get('kind')=='organization':
                  assert record['country']=='ES'; assert f'data-organization="{record["id"]}"' in friends
          seen_ids=set()
          for record in records:
              for key in ('id','name','category','country','url','reviewedAt'): assert record.get(key)
              assert record['id'] not in seen_ids; seen_ids.add(record['id']); assert record['category'] in directory['categories']; assert record['country'] in directory['countries']
              parsed_resource=urlparse(record['url']); assert parsed_resource.scheme=='https' and parsed_resource.netloc; reviewed=date.fromisoformat(record['reviewedAt']); assert reviewed<=today
          assert 'Sitemap: https://desgracias.es/sitemap.xml' in robots and 'Disallow: /\n' not in robots
          for hub in ('ansiedad', 'salud', 'violencia'):
              assert f'<loc>https://desgracias.es/{hub}/</loc>' in sitemap_text, f'Missing public hub: {hub}'
          total=len(entries); resource_count=sum(r.get('kind')=='resource' for r in records)
          print(f'SEO integrity checks passed for {total} sitemap URLs.'); print(f'Validated {checked_internal_links} root-relative navigational links.'); print(f'Help directory source: {len(records)} records (50 organizations, {resource_count} country resources), {len(country_options)} country selector options.'); print(f'Mandatory metadata coverage: JSON-LD {total}/{total}, OG site_name {total}/{total}, Twitter card {total}/{total}.'); print(f'Hero WebP: {hero_bytes} bytes.')
          PY
