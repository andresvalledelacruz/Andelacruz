name: P0/P1 Resource Liveness

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-liveness:
    name: Governed external resource availability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout production-v9
        uses: actions/checkout@v7
        with:
          ref: production-v9

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Probe governed P0/P1 resources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-p0-p1-resource-liveness.mjs | tee p0-p1-resource-liveness-report.json

      - name: Preserve P0/P1 resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-p1-resource-liveness-${{ github.run_id }}-${{ github.run_attempt }}
          path: p0-p1-resource-liveness-report.json
          if-no-files-found: warn
          retention-days: 30
