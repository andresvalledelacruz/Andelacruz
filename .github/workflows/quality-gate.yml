name: Engineering Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find src ops tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run test suite
        run: npm test
